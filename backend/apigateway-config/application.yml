server:
  port: 8089

eureka:
  client:
    serviceUrl:
      defaultZone: http://eureka:8761/eureka/

spring:
  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: https://login.microsoftonline.com/49d2b527-d999-453e-9ca1-ae9dd9284fc4/discovery/v2.0/keys
          issuer-uri: https://login.microsoftonline.com/49d2b527-d999-453e-9ca1-ae9dd9284fc4/v2.0
  cloud:
    gateway:
      globalcors:
        corsConfigurations:
          '[/**]':
            allowedOrigins:
              - "http://localhost:5173"
              - "http://localhost"
              - "https://localhost"
              - "https://54.90.203.135"
            allowedOriginPatterns:
              - "https://*.trycloudflare.com"
            allowedMethods:
              - GET
              - POST
              - PUT
              - DELETE
              - OPTIONS
            allowedHeaders: "*"
      routes:

        - id: inventory_service
          uri: lb://microservices-inventory
          predicates:
            - Path=/api/inventory/**
          filters:
            - StripPrefix=1

        - id: order_service
          uri: lb://microservices-order
          predicates:
            - Path=/api/order/**
          filters:
            - StripPrefix=1

        - id: shipment_service
          uri: lb://microservices-shipment
          predicates:
            - Path=/api/shipment/**
          filters:
            - StripPrefix=1

        - id: bff_service
          uri: lb://microservices-bff
          predicates:
            - Path=/api/bff/**
          filters:
            - StripPrefix=1

        - id: technician_service
          uri: lb://microservices-technician
          predicates:
            - Path=/api/technician/**
          filters:
            - StripPrefix=1

        - id: payment_service
          uri: lb://microservices-payment
          predicates:
            - Path=/api/payment/**
          filters:
            - StripPrefix=1

        - id: notification_service
          uri: lb://microservices-notification
          predicates:
            - Path=/api/notification/**
          filters:
            - StripPrefix=1

        - id: kafkaadmin_service
          uri: lb://microservices-kafkaadmin
          predicates:
            - Path=/api/kafka-admin/**
          filters:
            - StripPrefix=1

        - id: rabbitadmin_service
          uri: lb://microservices-rabbitadmin
          predicates:
            - Path=/api/rabbit-admin/**
          filters:
            - StripPrefix=1
