server.port=8093

spring.application.name=microservices-notification

eureka.client.serviceUrl.defaultZone=http://localhost:8761/eureka/
eureka.client.register-with-eureka=true
eureka.client.healthcheck.enabled=true
eureka.client.fetch-registry=true
spring.cloud.config.override-none=false

management.endpoints.web.exposure.include=*
management.endpoint.info.enabled=true
management.endpoint.health.enabled=true

spring.datasource.url=jdbc:mysql://localhost:3306/notification_db?createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

spring.rabbitmq.addresses=${RABBITMQ_ADDRESSES:localhost:5672}
spring.rabbitmq.username=${RABBITMQ_USERNAME:admin}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:admin123}

rabbitmq.exchange.topic=smartlogix.topic
rabbitmq.queue.notification=notification.queue
rabbitmq.queue.notification.dlq=notification.dlq
# Eventos que generan una notificación: servicios técnicos, resultados de pago y despachos
rabbitmq.routing.keys=technician.service.#,payment.result.#,logistics.shipment.dispatch

rabbitmq.retry.max-attempts=3
rabbitmq.retry.backoff-ms=1000
