server.port=8092

spring.application.name=microservices-payment

eureka.client.serviceUrl.defaultZone=http://localhost:8761/eureka/
eureka.client.register-with-eureka=true
eureka.client.healthcheck.enabled=true
eureka.client.fetch-registry=true
spring.cloud.config.override-none=false

management.endpoints.web.exposure.include=*
management.endpoint.info.enabled=true
management.endpoint.health.enabled=true

spring.datasource.url=jdbc:mysql://localhost:3306/payment_db?createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

spring.rabbitmq.addresses=${RABBITMQ_ADDRESSES:localhost:5672}
spring.rabbitmq.username=${RABBITMQ_USERNAME:admin}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:admin123}

rabbitmq.exchange.direct=smartlogix.direct
rabbitmq.exchange.topic=smartlogix.topic
rabbitmq.queue.payment.request=payment.request.queue
rabbitmq.queue.payment.request.dlq=payment.request.dlq
rabbitmq.routing.key.payment.request=payment.request
rabbitmq.routing.key.payment.result.prefix=payment.result

rabbitmq.retry.max-attempts=3
rabbitmq.retry.backoff-ms=1000

# Reglas de la pasarela simulada
payment.max-amount=2000000
payment.reject-card-last4=0000
