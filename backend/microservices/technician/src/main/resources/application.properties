server.port=8091

spring.application.name=microservices-technician

eureka.client.serviceUrl.defaultZone=http://localhost:8761/eureka/
eureka.client.register-with-eureka=true
eureka.client.healthcheck.enabled=true
eureka.client.fetch-registry=true
spring.cloud.config.override-none=false

management.endpoints.web.exposure.include=*
management.endpoint.info.enabled=true
management.endpoint.health.enabled=true

spring.datasource.url=jdbc:mysql://localhost:3306/technician_db?createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

spring.rabbitmq.addresses=${RABBITMQ_ADDRESSES:localhost:5672}
spring.rabbitmq.username=${RABBITMQ_USERNAME:admin}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:admin123}

rabbitmq.exchange.direct=smartlogix.direct
rabbitmq.exchange.topic=smartlogix.topic
rabbitmq.queue.payment.result=technician.payment.result.queue
rabbitmq.queue.payment.result.dlq=technician.payment.result.dlq
rabbitmq.routing.key.payment.request=payment.request
rabbitmq.routing.key.payment.result=payment.result.technician
rabbitmq.routing.key.event.prefix=technician.service

rabbitmq.retry.max-attempts=3
rabbitmq.retry.backoff-ms=1000
