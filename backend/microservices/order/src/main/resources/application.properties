#spring.application.name=order
server.port=8084


spring.application.name=microservices-order

eureka.client.serviceUrl.defaultZone=http://localhost:8761/eureka/
eureka.client.register-with-eureka=true
eureka.client.healthcheck.enabled=true
eureka.client.fetch-registry=true
spring.cloud.config.override-none=false
spring.web.resources.add-mappings=false


management.endpoints.web.exposure.include=*
management.endpoint.info.enabled=true
management.endpoint.health.enabled=true

#server.servlet.context-path=/business/v2

spring.security.user.name=admin
spring.security.user.password=Dlfor

spring.datasource.url=jdbc:mysql://localhost:3306/order_db
spring.datasource.username=root
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

spring.rabbitmq.addresses=${RABBITMQ_ADDRESSES:localhost:5672}
spring.rabbitmq.username=${RABBITMQ_USERNAME:admin}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:admin123}

rabbitmq.exchange.direct=smartlogix.direct
rabbitmq.exchange.topic=smartlogix.topic
rabbitmq.queue.order.notification=order.notification.queue
rabbitmq.queue.order.notification.dlq=order.notification.dlq
rabbitmq.queue.shipment.dispatch=shipment.dispatch.queue
rabbitmq.queue.shipment.dispatch.dlq=shipment.dispatch.dlq
rabbitmq.routing.key.order.notification=order.notification
rabbitmq.routing.key.shipment.dispatch=logistics.shipment.dispatch

