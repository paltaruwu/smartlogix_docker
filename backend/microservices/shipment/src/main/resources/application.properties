#spring.application.name=shipment
server.port=8087

spring.application.name=microservices-shipment

eureka.client.serviceUrl.defaultZone=http://localhost:8761/eureka/
eureka.client.register-with-eureka=true
eureka.client.healthcheck.enabled=true
eureka.client.fetch-registry=true
spring.cloud.config.override-none=false


management.endpoints.web.exposure.include=*
management.endpoint.info.enabled=true
management.endpoint.health.enabled=true

spring.security.user.name=admin
spring.security.user.password=Bmo53-s


spring.datasource.url=jdbc:mysql://localhost:3306/shipment_db
spring.datasource.username=root
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true




# ---------------------------------------------------------------------------
# Kafka: shipment consume order-events (crea el envío al aprobarse un pedido) y produce shipment-events
# ---------------------------------------------------------------------------
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092,localhost:9093,localhost:9094}
spring.kafka.client-id=microservices-shipment

# Productor: JSON tipado con DTO, sin pérdida de mensajes ni duplicados
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JacksonJsonSerializer
spring.kafka.producer.acks=all
spring.kafka.producer.retries=3
spring.kafka.producer.compression-type=lz4
spring.kafka.producer.properties.enable.idempotence=true
spring.kafka.producer.properties.linger.ms=5
# Si Kafka no responde, fallar rápido para no frenar la creación del envío
spring.kafka.producer.properties.max.block.ms=3000
spring.kafka.producer.properties.request.timeout.ms=5000
spring.kafka.producer.properties.delivery.timeout.ms=15000
spring.kafka.producer.properties.spring.json.add.type.headers=false

kafka.topic.shipment-events=shipment-events

# Consumidor: grupo shipment-group (distinto de inventory-group, así ambos reciben todos los eventos),
# commit manual por registro, deserializador tolerante a mensajes corruptos
spring.kafka.consumer.group-id=shipment-group
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.enable-auto-commit=false
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
spring.kafka.consumer.properties.spring.deserializer.value.delegate.class=org.springframework.kafka.support.serializer.JacksonJsonDeserializer
spring.kafka.consumer.properties.spring.json.value.default.type=com.storechain.shipment.dto.OrderEvent
spring.kafka.consumer.properties.spring.json.trusted.packages=com.storechain.shipment.dto
spring.kafka.consumer.properties.spring.json.use.type.headers=false
spring.kafka.consumer.properties.session.timeout.ms=15000
spring.kafka.consumer.properties.max.poll.interval.ms=300000
spring.kafka.listener.ack-mode=record
spring.kafka.listener.concurrency=3

kafka.topic.order-events=order-events
kafka.retry.max-attempts=3
kafka.retry.backoff-ms=1000
