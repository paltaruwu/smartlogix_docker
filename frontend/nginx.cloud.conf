# Nginx para la nube detrás de un túnel/proxy HTTPS (Cloudflare):
# sirve el frontend y pasa /api al gateway, así el navegador usa un solo origen https.
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    location /api/ {
        proxy_pass http://apigateway:8089/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Authorization $http_authorization;
    }

    # index.html siempre se revalida: así el navegador nunca se queda con una versión vieja de la app
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # Los archivos de assets llevan un hash en el nombre (cambia en cada build), se pueden guardar para siempre
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
}
