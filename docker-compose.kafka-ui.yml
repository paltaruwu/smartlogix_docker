# Kafka-UI: administración de brokers, tópicos, particiones, consumer groups y mensajes.
#
# Debe levantarse en el mismo proyecto que el clúster para ver los brokers por la red interna:
#   docker compose -f docker-compose.kafka.yml -f docker-compose.kafka-ui.yml up -d
# o con todo el proyecto:
#   docker compose -f docker-compose.local.yml -f docker-compose.kafka.yml -f docker-compose.kafka-ui.yml up -d
#
# Interfaz: http://localhost:8085


services:

  kafka-ui:
    image: provectuslabs/kafka-ui:v0.7.2
    container_name: sl-kafka-ui
    restart: unless-stopped
    ports:
      - "8085:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: smartlogix
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka1:29092,kafka2:29092,kafka3:29092
      KAFKA_CLUSTERS_0_ZOOKEEPER: zookeeper1:2181,zookeeper2:2181,zookeeper3:2181
      DYNAMIC_CONFIG_ENABLED: "true"
      JAVA_OPTS: -Xms128m -Xmx256m
