# Clúster Kafka: 3 nodos Zookeeper (ensemble) + 3 brokers + job que crea los tópicos.
#
# Levantar junto al resto del proyecto (misma red de Docker):
#   docker compose -f docker-compose.local.yml -f docker-compose.kafka.yml up -d
# Solo Kafka:
#   docker compose -f docker-compose.kafka.yml up -d
#
# Los microservicios se conectan por la red interna a kafka1:29092,kafka2:29092,kafka3:29092.
# Desde tu PC (herramientas externas) los brokers están en localhost:9092, :9093 y :9094.


x-zookeeper: &zookeeper-common
  image: confluentinc/cp-zookeeper:7.6.1
  restart: unless-stopped
  environment: &zookeeper-env
    ZOOKEEPER_CLIENT_PORT: 2181
    ZOOKEEPER_TICK_TIME: 2000
    ZOOKEEPER_INIT_LIMIT: 5
    ZOOKEEPER_SYNC_LIMIT: 2
    ZOOKEEPER_SERVERS: zookeeper1:2888:3888;zookeeper2:2888:3888;zookeeper3:2888:3888
    KAFKA_HEAP_OPTS: -Xms128m -Xmx192m

x-kafka: &kafka-common
  image: confluentinc/cp-kafka:7.6.1
  restart: unless-stopped
  healthcheck:
    test: ["CMD-SHELL", "kafka-broker-api-versions --bootstrap-server localhost:29092 > /dev/null 2>&1"]
    interval: 15s
    timeout: 10s
    retries: 20
    start_period: 30s

x-kafka-env: &kafka-env
  KAFKA_ZOOKEEPER_CONNECT: zookeeper1:2181,zookeeper2:2181,zookeeper3:2181
  KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
  KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
  # Tolerancia a fallos: todo se replica en los 3 brokers y se exigen 2 réplicas en sincronía
  KAFKA_DEFAULT_REPLICATION_FACTOR: 3
  KAFKA_NUM_PARTITIONS: 3
  KAFKA_MIN_INSYNC_REPLICAS: 2
  KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 3
  KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 3
  KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 2
  # Los tópicos los crean kafka-init y el microservicio kafkaadmin, no se crean solos
  KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
  KAFKA_DELETE_TOPIC_ENABLE: "true"
  KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
  KAFKA_HEAP_OPTS: -Xms256m -Xmx384m

services:

  zookeeper1:
    <<: *zookeeper-common
    container_name: sl-zookeeper1
    hostname: zookeeper1
    environment:
      <<: *zookeeper-env
      ZOOKEEPER_SERVER_ID: 1

  zookeeper2:
    <<: *zookeeper-common
    container_name: sl-zookeeper2
    hostname: zookeeper2
    environment:
      <<: *zookeeper-env
      ZOOKEEPER_SERVER_ID: 2

  zookeeper3:
    <<: *zookeeper-common
    container_name: sl-zookeeper3
    hostname: zookeeper3
    environment:
      <<: *zookeeper-env
      ZOOKEEPER_SERVER_ID: 3

  kafka1:
    <<: *kafka-common
    container_name: sl-kafka1
    hostname: kafka1
    depends_on: [zookeeper1, zookeeper2, zookeeper3]
    ports:
      - "9092:9092"
    environment:
      <<: *kafka-env
      KAFKA_BROKER_ID: 1
      KAFKA_LISTENERS: INTERNAL://0.0.0.0:29092,EXTERNAL://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka1:29092,EXTERNAL://localhost:9092
    volumes:
      - kafka1_data:/var/lib/kafka/data

  kafka2:
    <<: *kafka-common
    container_name: sl-kafka2
    hostname: kafka2
    depends_on: [zookeeper1, zookeeper2, zookeeper3]
    ports:
      - "9093:9093"
    environment:
      <<: *kafka-env
      KAFKA_BROKER_ID: 2
      KAFKA_LISTENERS: INTERNAL://0.0.0.0:29092,EXTERNAL://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka2:29092,EXTERNAL://localhost:9093
    volumes:
      - kafka2_data:/var/lib/kafka/data

  kafka3:
    <<: *kafka-common
    container_name: sl-kafka3
    hostname: kafka3
    depends_on: [zookeeper1, zookeeper2, zookeeper3]
    ports:
      - "9094:9094"
    environment:
      <<: *kafka-env
      KAFKA_BROKER_ID: 3
      KAFKA_LISTENERS: INTERNAL://0.0.0.0:29092,EXTERNAL://0.0.0.0:9094
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka3:29092,EXTERNAL://localhost:9094
    volumes:
      - kafka3_data:/var/lib/kafka/data

  # Crea los tópicos con sus parámetros de administración (idempotente: si existen no hace nada)
  kafka-init:
    image: confluentinc/cp-kafka:7.6.1
    container_name: sl-kafka-init
    restart: "no"
    depends_on:
      kafka1:
        condition: service_healthy
      kafka2:
        condition: service_healthy
      kafka3:
        condition: service_healthy
    volumes:
      - ./backend/kafka/create-topics.sh:/create-topics.sh:ro
    entrypoint: ["bash", "/create-topics.sh"]

volumes:
  kafka1_data:
  kafka2_data:
  kafka3_data:
